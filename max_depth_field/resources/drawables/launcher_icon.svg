<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!--
    Launcher icon: the depth widget's disc of water, with the arrow stopping on
    a floor line to say "deepest reached" rather than "current".

    Built from flat fills and bold shapes only: no gradients, strokes, opacity
    or fine detail, none of which survive the rasterisation down to 38-65 px or
    the 64-colour MIP displays. The white band of the surface is the gap between
    two copies of the same wave, offset vertically, rather than a stroke.

    This is the master copy, and Max Depth is the only app that ships it. The
    other four take depth_icon.svg, which is this same disc with the arrow
    running on into the deep instead of stopping. Everything but the arrow is
    shared between the two on purpose: the family has to be recognisable at a
    glance in the data field picker, where Depth and Max Depth sit next to each
    other, while still being told apart.

    Copy this file over max_depth_field/resources/drawables/launcher_icon.svg
    rather than editing that one in place; it is expected to be identical to it.

    width/height deliberately match the viewBox. Leaving the size at "100%"
    makes the resource compiler assume 400x400 and downscale 10:1, which softens
    the edge enough that the icon reads as smaller and off-centre next to a
    native one; declaring a size that disagrees with the viewBox leaves the
    scale up to the rasteriser instead. See depth_icon.svg for the long version.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" version="1.1">
    <defs>
        <clipPath id="disc">
            <circle cx="64" cy="64" r="64"/>
        </clipPath>
    </defs>
    <g clip-path="url(#disc)">
        <!-- Shallow water above the surface, deep water below it. -->
        <rect x="0" y="0" width="128" height="128" fill="#5CC8F5"/>
        <path d="M -4,38 Q 20,30 44,38 Q 68,46 92,38 Q 116,30 140,38 L 140,132 L -4,132 Z" fill="#FFFFFF"/>
        <path d="M -4,46 Q 20,38 44,46 Q 68,54 92,46 Q 116,38 140,46 L 140,132 L -4,132 Z" fill="#00539C"/>
        <!-- Depth arrow, stopped on the floor line that marks the maximum. -->
        <rect x="57" y="56" width="14" height="24" fill="#FFFFFF"/>
        <polygon points="44,78 84,78 64,104" fill="#FFFFFF"/>
        <rect x="38" y="110" width="52" height="9" fill="#FFFFFF"/>
    </g>
</svg>
