<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!--
    Launcher icon: a disc of water seen from the side, split by the wave of the
    surface, with an arrow marking the descent into the deep.

    The icon is rasterised down to 40-65 pixels depending on the device and has
    to survive the 64-colour MIP displays, so it is built from flat fills and
    bold shapes only: no gradients, strokes, opacity or fine detail, all of
    which either turn to mush or are not supported by the resource compiler.
    The white band of the surface is the gap between two copies of the same
    wave, offset vertically, rather than a stroke. The blue matches the accent
    the widget uses for the current depth page.

    Targets ask for 40, 60, 62 or 65 px, so the icon is authored larger than all
    of them and every device downscales rather than upscales. Leaving the size
    at "100%" makes the resource compiler assume 400x400 and downscale 10:1,
    which softens the edge enough that the icon reads as smaller and off-centre
    next to a native one. width/height deliberately match the viewBox: declaring
    a size that disagrees with it (65 against a 128 viewBox) leaves the scale up
    to the rasteriser, and they do not agree. The disc is full bleed (r = half
    the viewBox) so it fills the slot it is given; a 1px inset disappears into
    rounding at these sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 128 128" version="1.1">
    <defs>
        <clipPath id="disc">
            <circle cx="64" cy="64" r="64"/>
        </clipPath>
    </defs>
    <g clip-path="url(#disc)">
        <!-- Shallow water, filling the whole disc. -->
        <rect x="0" y="0" width="128" height="128" fill="#5CC8F5"/>
        <!-- The surface, and the deep water 8px below it. -->
        <path d="M -4,38 Q 20,30 44,38 Q 68,46 92,38 Q 116,30 140,38 L 140,132 L -4,132 Z" fill="#FFFFFF"/>
        <path d="M -4,46 Q 20,38 44,46 Q 68,54 92,46 Q 116,38 140,46 L 140,132 L -4,132 Z" fill="#00539C"/>
        <!-- Depth arrow, pointing down into the deep water. -->
        <rect x="57" y="56" width="14" height="32" fill="#FFFFFF"/>
        <polygon points="44,84 84,84 64,116" fill="#FFFFFF"/>
    </g>
</svg>
