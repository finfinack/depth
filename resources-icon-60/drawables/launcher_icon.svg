<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!--
    Launcher icon: the depth widget's disc of water, with the arrow stopping on
    a floor line to say "deepest reached" rather than "current".

    Built from flat fills and bold shapes only: no gradients, strokes, opacity
    or fine detail, none of which survive the rasterisation down to 38-65 px or
    the 64-colour MIP displays. The white band of the surface is the gap between
    two copies of the same wave, offset vertically, rather than a stroke.

    This is the master copy. The resources-icon-NN folders hold the same file
    declared at each launcher size the targets ask for, so the resource compiler
    never rescales the bitmap; they differ from this one only in the width and
    height attributes below and must be kept in step with it.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 128 128" version="1.1">
    <defs>
        <clipPath id="disc">
            <circle cx="64" cy="64" r="64"/>
        </clipPath>
    </defs>
    <g clip-path="url(#disc)">
        <!-- Shallow water above the surface, deep water below it. -->
        <rect x="0" y="0" width="128" height="128" fill="#5CC8F5"/>
        <path d="M -4,38 Q 20,30 44,38 Q 68,46 92,38 Q 116,30 140,38 L 140,132 L -4,132 Z" fill="#FFFFFF"/>
        <path d="M -4,46 Q 20,38 44,46 Q 68,54 92,46 Q 116,38 140,46 L 140,132 L -4,132 Z" fill="#00539C"/>
        <!-- Depth arrow, stopped on the floor line that marks the maximum. -->
        <rect x="57" y="56" width="14" height="24" fill="#FFFFFF"/>
        <polygon points="44,78 84,78 64,104" fill="#FFFFFF"/>
        <rect x="38" y="110" width="52" height="9" fill="#FFFFFF"/>
    </g>
</svg>
